<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>猜数字</title>
<style>
body{font-family:Arial;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0}
h1{color:#00d4ff}
input{padding:10px;font-size:18px;width:120px;text-align:center;border:none;border-radius:5px}
button{padding:10px 20px;font-size:18px;margin-left:10px;border:none;border-radius:5px;background:#00d4ff;cursor:pointer}
#result{margin-top:20px;font-size:20px;min-height:30px}
#tries{margin-top:10px;color:#aaa}
</style>
</head>
<body>
<h1>猜数字游戏</h1>
<p>范围 1~100</p >
<div>
  <input type="number" id="num" min="1" max="100">
  <button onclick="guess()">猜！</button>
</div>
<div id="result"></div>
<div id="tries"></div>
<script>
let answer = Math.floor(Math.random()*100)+1;
let count = 0;
function guess(){
  let val = +document.getElementById('num').value;
  if(!val || val<1 || val>100){alert('输入1~100之间的数');return}
  count++;
  if(val===answer){
    document.getElementById('result').innerHTML = `🎉 猜对了！答案就是 ${answer}`;
    document.getElementById('tries').textContent = `共猜了 ${count} 次`;
    setTimeout(()=>{answer=Math.floor(Math.random()*100)+1;count=0;
      document.getElementById('result').textContent='';
      document.getElementById('tries').textContent='';
      document.getElementById('num').value='';
    },2000);
  } else if(val>answer){
    document.getElementById('result').textContent='⬇️ 太大了';
  } else {
    document.getElementById('result').textContent='⬆️ 太小了';
  }
  document.getElementById('num').value='';
  document.getElementById('num').focus();
}
document.getElementById('num').addEventListener('keydown',e=>{if(e.key==='Enter')guess()});
</script>
</body>
</html>
