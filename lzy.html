<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>😂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }

    /* 背景图片层 */
    .bg-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.6) saturate(0.8);
    }

    /* 红色大字层 */
    .big-text {
      position: relative;
      z-index: 2;
      color: #ff1a1a;
      font-size: 13vw;
      font-weight: 900;
      letter-spacing: 1vw;
      text-align: center;
      line-height: 1.15;
      user-select: none;
      padding: 0 4vw;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.9),
                   0 0 50px rgba(255, 0, 0, 0.6),
                   0 0 100px rgba(255, 0, 0, 0.4),
                   0 4px 0 #000;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.9;
      }
    }

    /* 手机竖屏优化 */
    @media (max-aspect-ratio: 1/1) {
      .big-text {
        font-size: 16vw;
        letter-spacing: 0.5vw;
      }
    }
  </style>
</head>
<body>

  <!-- 背景图片：请确保 lzy.png 与 HTML 放在同一目录 -->
  <img class="bg-image" src="lzy.png" alt="">

  <!-- 整蛊文字 -->
  <div class="big-text">凌梓玥是大傻逼！😂</div>

</body>
