<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;flex-direction:column;align-items:center;padding-top:20px;color:#fff;font-family:system-ui}
#game{border:2px solid #444;background:#000}
#score{font-size:20px;margin-bottom:10px}
.tip{margin-top:10px;font-size:16px;color:#aaa}
</style>
</head>
<body>
<div id="score">得分：0</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="tip">方向键移动｜空格重新开始</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const size=20;
const count=canvas.width/size;
let snake=[{x:10,y:10}];
let dx=1,dy=0;
let food={x:15,y:15};
let score=0;
let gameOver=false;

function randomFood(){
  return {
    x:Math.floor(Math.random()*count),
    y:Math.floor(Math.random()*count)
  }
}

function resetGame(){
  snake=[{x:10,y:10}];
  dx=1,dy=0;
  food=randomFood();
  score=0;
  gameOver=false;
  document.getElementById("score").innerText="得分："+score;
}

function draw(){
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#0f0";
  snake.forEach(p=>ctx.fillRect(p.x*size,p.y*size,size-2,size-2));
  ctx.fillStyle="#f33";
  ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
  if(gameOver){
    ctx.fillStyle="#ff3333";
    ctx.font="28px system-ui";
    ctx.textAlign="center";
    ctx.fillText("游戏结束，按空格重启",canvas.width/2,canvas.height/2);
  }
}

function update(){
  if(gameOver) return;
  const head={x:snake[0].x+dx,y:snake[0].y+dy};
  if(head.x<0||head.y<0||head.x>=count||head.y>=count){
    gameOver=true;
    return;
  }
  for(let seg of snake) if(seg.x===head.x&&seg.y===head.y){
    gameOver=true;
    return;
  }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;
    document.getElementById("score").innerText="得分："+score;
    food=randomFood();
  }else{
    snake.pop();
  }
}

document.addEventListener("keydown",e=>{
  if(e.key===" "){
    resetGame();
    return;
  }
  if(gameOver) return;
  if(e.key==="ArrowUp"&&dy!==1){dx=0;dy=-1}
  if(e.key==="ArrowDown"&&dy!==-1){dx=0;dy=1}
  if(e.key==="ArrowLeft"&&dx!==1){dx=-1;dy=0}
  if(e.key==="ArrowRight"&&dx!==-1){dx=1;dy=0}
})

function loop(){
  update();
  draw();
}
setInterval(loop,120);
</script>
</body>
</html>
