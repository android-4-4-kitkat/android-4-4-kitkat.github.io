<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NORTH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#1a1a2e;color:#fff;min-height:100vh}
header{padding:30px;text-align:center}
header h1{font-size:42px;color:#ff0000;letter-spacing:12px;font-weight:900}
.tabs{display:flex;justify-content:center;gap:10px;padding:10px}
.tabs button{padding:8px 24px;border:none;border-radius:20px;background:#333;
  color:#fff;cursor:pointer;font-size:14px}
.tabs button.active{background:#ff0000;color:#fff;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;
  padding:20px;max-width:1200px;margin:0 auto}
.card{position:relative;border-radius:10px;overflow:hidden;cursor:pointer;
  background:#2b2b3d;aspect-ratio:1}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover img{transform:scale(1.08)}
.vcard{aspect-ratio:16/9}
.vcard .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:40px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;
  align-items:center;justify-content:center;z-index:999;flex-direction:column}
.modal.show{display:flex}
.modal img{max-width:92%;max-height:85%;border-radius:8px}
.modal video{max-width:92%;max-height:85%;border-radius:8px}
.modal .close{position:absolute;top:20px;right:30px;font-size:36px;color:#fff;
  cursor:pointer;line-height:1}
</style>
</head>
<body>
<header><h1>NORTH</h1></header>

<div class="tabs">
  <button class="active" onclick="showTab('img',this)">图片</button>
  <button onclick="showTab('video',this)">视频</button>
</div>

<div class="grid" id="imgGrid"></div>
<div class="grid" id="videoGrid" style="display:none"></div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <span class="close" onclick="closeModal()">&times;</span>
  < img id="modalImg" style="display:none">
  <video id="modalVideo" controls style="display:none"></video>
</div>

<script>
const IMG_COUNT = 5;
const VIDEO_COUNT = 2;
const IMG_EXT = 'png';
const VIDEO_EXT = 'mp4';

const imgGrid=document.getElementById('imgGrid');
const videoGrid=document.getElementById('videoGrid');

for(let i=1;i<=IMG_COUNT;i++){
  const url=`${i}.${IMG_EXT}`;
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`< img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none'">`;
  c.onclick=()=>openImg(url);
  imgGrid.appendChild(c);
}

const letters='abcdefghijklmnopqrstuvwxyz';
for(let i=0;i<VIDEO_COUNT;i++){
  const url=`${letters[i]}.${VIDEO_EXT}`;
  const c=document.createElement('div');
  c.className='card vcard';
  c.innerHTML=`<div class="play">▶</div>`;
  c.onclick=()=>openVideo(url);
  videoGrid.appendChild(c);
}

function showTab(t,btn){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  imgGrid.style.display=t==='img'?'grid':'none';
  videoGrid.style.display=t==='video'?'grid':'none';
}

function openImg(src){
  const m=document.getElementById('modal');
  const im=document.getElementById('modalImg');
  const vd=document.getElementById('modalVideo');
  im.src=src;im.style.display='block';vd.style.display='none';vd.pause();
  m.classList.add('show');
}
function openVideo(src){
  const m=document.getElementById('modal');
  const im=document.getElementById('modalImg');
  const vd=document.getElementById('modalVideo');
  vd.src=src;vd.style.display='block';im.style.display='none';vd.play();
  m.classList.add('show');
}
function closeModal(e){
  if(e&&e.target.tagName==='IMG')return;
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modalVideo').pause();
}
</script>
</body>
</html>
