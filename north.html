<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORTH</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#181826;
  color:#fff;
  font-family:Microsoft YaHei,sans-serif;
  min-height:100vh;
  padding:30px 16px;
}
h1{
  text-align:center;
  font-size:44px;
  color:#ff2222;
  letter-spacing:8px;
  margin-bottom:24px;
}
.tab-box{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:30px;
}
.tab-box button{
  border:none;
  padding:8px 26px;
  border-radius:22px;
  font-size:15px;
  cursor:pointer;
  background:#333;
  color:white;
}
.tab-box button.active{
  background:#ff2222;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:14px;
  max-width:1100px;
  margin:0 auto;
}
.card{
  background:#28283b;
  border-radius:10px;
  aspect-ratio:1/1;
  overflow:hidden;
  cursor:pointer;
  position:relative;
}
.video-card{
  aspect-ratio:16/9;
}
.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.play-icon{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#fff;
  text-shadow:0 0 8px #000;
  pointer-events:none;
}
/*弹窗预览*/
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:20px;
}
.modal.show{
  display:flex;
}
.modal-img{
  max-width:94%;
  max-height:86vh;
  border-radius:6px;
}
.modal-video{
  max-width:94%;
  max-height:86vh;
  border-radius:6px;
}
.close-btn{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:#fff;
  cursor:pointer;
}
</style>
</head>
<body>
<h1>NORTH</h1>
<div class="tab-box">
  <button class="active" onclick="switchTab('img',this)">图片</button>
  <button onclick="switchTab('video',this)">视频</button>
</div>

<div class="grid" id="imgGrid"></div>
<div class="grid" id="videoGrid" style="display:none"></div>

<div class="modal" id="modal">
  <span class="close-btn" onclick="closeModal()">×</span>
  < img class="modal-img" id="modalImg">
  <video class="modal-video" id="modalVideo" controls></video>
</div>

<script>
//你的文件列表
const imgList = ["1.png","2.png","3.png","4.png","5.png"];
const videoList = ["a.mp4","b.mp4"];

const imgGrid = document.getElementById("imgGrid");
const videoGrid = document.getElementById("videoGrid");

//生成图片卡片
imgList.forEach(url=>{
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `< img src="${url}" loading="lazy" onerror="this.parentElement.style.display='none'">`;
  div.onclick = ()=>openImage(url);
  imgGrid.appendChild(div);
})

//生成视频卡片
videoList.forEach(url=>{
  const div = document.createElement("div");
  div.className = "card video-card";
  div.innerHTML = `<div class="play-icon">▶</div>`;
  div.onclick = ()=>openVideo(url);
  videoGrid.appendChild(div);
})

//切换标签
function switchTab(type,btn){
  document.querySelectorAll(".tab-box button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(type === "img"){
    imgGrid.style.display = "grid";
    videoGrid.style.display = "none";
  }else{
    imgGrid.style.display = "none";
    videoGrid.style.display = "grid";
  }
}

//打开图片弹窗
function openImage(src){
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalVideo = document.getElementById("modalVideo");
  modalImg.src = src;
  modalImg.style.display = "block";
  modalVideo.style.display = "none";
  modal.classList.add("show");
}

//打开视频弹窗播放
function openVideo(src){
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalVideo = document.getElementById("modalVideo");
  modalVideo.src = src;
  modalVideo.style.display = "block";
  modalImg.style.display = "none";
  modal.classList.add("show");
  modalVideo.play();
}

//关闭弹窗
function closeModal(){
  const modal = document.getElementById("modal");
  const modalVideo = document.getElementById("modalVideo");
  modal.classList.remove("show");
  modalVideo.pause();
}
//点击空白关闭弹窗
document.getElementById("modal").onclick = function(e){
  if(e.target === this) closeModal();
}
</script>
</body>
</html>
