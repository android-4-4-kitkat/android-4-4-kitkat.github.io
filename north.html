<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORTH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    color: #fff;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    padding: 20px;
  }

  /* 顶端红色标题 */
  header {
    text-align: center;
    padding: 20px 0 30px;
  }
  header h1 {
    color: red;
    font-size: 42px;
    letter-spacing: 4px;
    font-weight: bold;
  }

  /* 区块标题 */
  h2 {
    font-size: 20px;
    margin: 30px 0 15px;
    border-left: 4px solid red;
    padding-left: 10px;
  }

  /* 网格布局 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
  }

  /* 图片缩略图 */
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    background: #222;
  }
  .thumb:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
  }

  /* 视频卡片 */
  .video-card {
    background: #1c1c1c;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .video-card:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
  }
  .video-card video {
    width: 100%;
    display: block;
    pointer-events: none; /* 让点击由卡片处理，避免直接播放 */
  }
  .video-card .play-icon {
    position: relative;
    text-align: center;
    margin-top: -50%;
    margin-bottom: 50%;
    font-size: 50px;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 0 10px #000;
    pointer-events: none;
  }

  /* ===== 图片灯箱 ===== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: #fff;
    cursor: pointer;
    line-height: 1;
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 50px;
    color: #fff;
    cursor: pointer;
    user-select: none;
    padding: 10px;
    opacity: 0.7;
  }
  .lightbox .nav:hover { opacity: 1; }
  .lightbox .prev { left: 15px; }
  .lightbox .next { right: 15px; }

  /* ===== 视频播放器弹层 ===== */
  .player {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }
  .player.active { display: flex; }
  .player .player-title {
    color: red;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 3px;
    margin-bottom: 15px;
  }
  .player video {
    max-width: 90vw;
    max-height: 80vh;
    border-radius: 6px;
    background: #000;
  }
  .player .close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 40px;
    color: #fff;
    cursor: pointer;
    line-height: 1;
  }

  footer {
    text-align: center;
    color: #555;
    font-size: 13px;
    margin: 50px 0 20px;
  }
</style>
</head>
<body>

  <!-- 顶端红色标题 -->
  <header>
    <h1>NORTH</h1>
  </header>

  <!-- 图片区 -->
  <h2>图片</h2>
  <div class="grid" id="imageGrid"></div>

  <!-- 视频区 -->
  <h2>视频</h2>
  <div class="grid" id="videoGrid"></div>

  <footer>© NORTH</footer>

  <!-- 图片灯箱 -->
  <div class="lightbox" id="lightbox">
    <span class="close" onclick="closeLightbox()">&times;</span>
    <span class="nav prev" onclick="prevImage(event)">&#10094;</span>
    <img id="lightboxImg" src="" alt="">
    <span class="nav next" onclick="nextImage(event)">&#10095;</span>
  </div>

  <!-- 视频播放器 -->
  <div class="player" id="player">
    <span class="close" onclick="closePlayer()">&times;</span>
    <div class="player-title">NORTH</div>
    <video id="playerVideo" controls autoplay></video>
  </div>

<script>
  /* ====== 素材列表（直接放在仓库根目录） ====== */
  const images = [
    "1.png",
    "2.png",
    "3.png",
    "4.png",
    "5.png"
  ];

  const videos = [
    "a.mp4",
    "b.mp4"
  ];

  /* ====== 生成图片缩略图 ====== */
  const imageGrid = document.getElementById("imageGrid");
  images.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = "图片 " + (i + 1);
    img.className = "thumb";
    img.loading = "lazy";
    img.onclick = () => openLightbox(i);
    imageGrid.appendChild(img);
  });

  /* ====== 生成视频卡片（用 video 标签做预览图） ====== */
  const videoGrid = document.getElementById("videoGrid");
  videos.forEach((src, i) => {
    const card = document.createElement("div");
    card.className = "video-card";
    card.onclick = () => openPlayer(src);

    const vid = document.createElement("video");
    vid.src = src;
    vid.muted = true;
    vid.preload = "metadata"; // 加载第一帧作为预览图
    vid.setAttribute("playsinline", "");

    const play = document.createElement("div");
    play.className = "play-icon";
    play.textContent = "▶";

    card.appendChild(vid);
    card.appendChild(play);
    videoGrid.appendChild(card);
  });

  /* ====== 图片灯箱逻辑 ====== */
  let currentIndex = 0;
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  function openLightbox(index) {
    currentIndex = index;
    lightboxImg.src = images[currentIndex];
    lightbox.classList.add("active");
  }
  function closeLightbox() {
    lightbox.classList.remove("active");
    lightboxImg.src = "";
  }
  function prevImage(e) {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex];
  }
  function nextImage(e) {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex];
  }
  // 点击空白处关闭
  lightbox.onclick = (e) => {
    if (e.target === lightbox) closeLightbox();
  };
  // 键盘左右键切换，Esc 关闭
  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("active")) return;
    if (e.key === "ArrowLeft") prevImage(e);
    if (e.key === "ArrowRight") nextImage(e);
    if (e.key === "Escape") closeLightbox();
  });

  /* ====== 视频播放器逻辑 ====== */
  const player = document.getElementById("player");
  const playerVideo = document.getElementById("playerVideo");

  function openPlayer(src) {
    playerVideo.src = src;
    player.classList.add("active");
    playerVideo.play();
  }
  function closePlayer() {
    playerVideo.pause();
    playerVideo.src = "";
    player.classList.remove("active");
  }
  // 点击空白处关闭
  player.onclick = (e) => {
    if (e.target === player) closePlayer();
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && player.classList.contains("active")) closePlayer();
  });
</script>

</body>
</html>
