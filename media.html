<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>肥美音乐图片视频集合网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0f0c;
      background-image: radial-gradient(circle at 20% 30%, rgba(30, 80, 50, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(20, 120, 60, 0.1) 0%, transparent 50%);
      color: #e0e8e0;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      padding: 20px 16px 30px;
      -webkit-tap-highlight-color: transparent;
    }

    body.locked {
      overflow: hidden;
      height: 100vh;
    }

    .site-title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #2ecc71;
      text-shadow: 0 0 20px rgba(46, 204, 113, 0.4), 0 0 40px rgba(46, 204, 113, 0.1);
      padding: 10px 0 20px;
      user-select: none;
      cursor: pointer;
    }

    .bgm-bar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 30, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(46, 204, 113, 0.25);
      border-radius: 40px;
      padding: 6px 14px 6px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s, border-color 0.3s;
    }

    .bgm-bar .bgm-label { font-size: 12px; color: #8fbf9f; letter-spacing: 1px; }

    .bgm-bar .bgm-btn {
      background: transparent;
      border: none;
      color: #2ecc71;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 20px;
      transition: all 0.25s;
      font-weight: 600;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .bgm-bar .bgm-btn:hover { background: rgba(46, 204, 113, 0.15); }
    .bgm-bar .bgm-btn.active { background: #2ecc71; color: #0b0f0c; }

    .bgm-bar.disabled {
      opacity: 0.55;
      border-color: rgba(120, 130, 120, 0.25);
    }

    .bgm-bar.disabled .bgm-label { color: #6a7a6a; }

    .bgm-bar.disabled .bgm-btn {
      color: #6a7a6a;
      cursor: not-allowed;
      background: transparent;
      font-size: 12px;
      letter-spacing: 0;
    }

    .bgm-bar.disabled .bgm-btn:hover { background: transparent; }

    .music-toast {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 500;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(20, 30, 24, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(46, 204, 113, 0.35);
      border-radius: 30px;
      padding: 6px 8px 6px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(46, 204, 113, 0.1);
      transition: opacity 0.3s, transform 0.3s;
      max-width: 240px;
    }

    .music-toast.show { display: flex; }

    .music-toast .toast-icon {
      font-size: 16px;
      animation: toastPulse 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    .music-toast.paused .toast-icon { animation-play-state: paused; opacity: 0.6; }

    @keyframes toastPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    .music-toast .toast-text {
      font-size: 12px;
      color: #b8e0c0;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .music-toast .toast-stop {
      background: transparent;
      border: 1px solid rgba(46, 204, 113, 0.35);
      color: #2ecc71;
      font-size: 14px;
      line-height: 1;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      padding: 0;
      font-family: inherit;
    }

    .music-toast .toast-stop:hover {
      background: rgba(46, 204, 113, 0.2);
      border-color: #2ecc71;
    }

    .music-toast .toast-stop:active { transform: scale(0.9); }

    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .tab-bar button {
      border: 1px solid rgba(46, 204, 113, 0.3);
      background: rgba(20, 30, 24, 0.7);
      color: #a0c8a8;
      padding: 8px 28px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s;
      font-weight: 500;
      backdrop-filter: blur(6px);
    }

    .tab-bar button:hover { border-color: #2ecc71; color: #d0f0d8; }
    .tab-bar button.active {
      background: #2ecc71; color: #0b0f0c; border-color: #2ecc71;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3); font-weight: 700;
    }

    .tab-bar button.hidden-tab {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: rgba(20, 28, 22, 0.8);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(46, 204, 113, 0.12);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(46, 204, 113, 0.45);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(46, 204, 113, 0.08);
    }

    .card:active { transform: scale(0.98); }

    .card img, .card video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .play-icon {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px; color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
      pointer-events: none; transition: transform 0.3s; line-height: 1;
    }

    .card:hover .play-icon { transform: translate(-50%, -50%) scale(1.15); }
    .card.video-card { aspect-ratio: 16 / 9; }

    .card.music-card {
      aspect-ratio: auto; min-height: 80px;
      display: flex; align-items: center; justify-content: center;
      padding: 18px 14px; text-align: center;
      background: linear-gradient(145deg, rgba(18, 28, 22, 0.95), rgba(12, 20, 15, 0.95));
    }

    .music-card .music-icon { font-size: 22px; margin-right: 8px; opacity: 0.6; }
    .music-card .music-name {
      font-size: 15px; color: #b8e0c0; letter-spacing: 2px;
      font-weight: 500; transition: color 0.3s;
    }

    .card.music-card:hover .music-name { color: #2ecc71; }
    .card.music-card.playing { border-color: #2ecc71; box-shadow: 0 0 28px rgba(46, 204, 113, 0.25); }
    .card.music-card.playing .music-name { color: #2ecc71; font-weight: 700; }

    .nazi-grid {
      display: none;
      justify-content: center;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 0;
      min-height: 50vh;
    }

    .nazi-grid.show { display: flex; }

    .nazi-btn {
      position: relative;
      width: min(78vw, 420px);
      height: min(78vw, 420px);
      max-height: 60vh;
      border-radius: 50%;
      border: 3px solid rgba(255, 60, 60, 0.6);
      background:
        radial-gradient(circle at 50% 40%, rgba(255, 80, 80, 0.35) 0%, rgba(80, 0, 0, 0.9) 70%),
        linear-gradient(145deg, #2a0a0a, #0e0505);
      color: #ffdede;
      font-size: clamp(24px, 6vw, 44px);
      font-weight: 900;
      letter-spacing: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10%;
      font-family: inherit;
      box-shadow:
        0 0 30px rgba(255, 60, 60, 0.5),
        0 0 60px rgba(255, 30, 30, 0.35),
        inset 0 0 40px rgba(255, 80, 80, 0.35);
      text-shadow:
        0 0 12px rgba(255, 90, 90, 0.9),
        0 0 24px rgba(255, 40, 40, 0.6);
      transition: transform 0.12s ease, box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      animation: naziGlow 1.8s ease-in-out infinite;
    }

    @keyframes naziGlow {
      0%, 100% {
        box-shadow:
          0 0 30px rgba(255, 60, 60, 0.5),
          0 0 60px rgba(255, 30, 30, 0.35),
          inset 0 0 40px rgba(255, 80, 80, 0.35);
      }
      50% {
        box-shadow:
          0 0 45px rgba(255, 80, 80, 0.75),
          0 0 90px rgba(255, 40, 40, 0.5),
          inset 0 0 55px rgba(255, 100, 100, 0.5);
      }
    }

    .nazi-btn:hover {
      border-color: rgba(255, 90, 90, 0.9);
    }

    .nazi-btn:active {
      transform: scale(0.94);
    }

    .nazi-btn.pressed {
      animation: naziFlash 0.18s ease;
    }

    @keyframes naziFlash {
      0% { transform: scale(1); }
      50% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    .beimadai-grid {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 0;
    }

    .beimadai-grid.show { display: block; }

    .beimadai-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .beimadai-col {
      background: rgba(16, 24, 18, 0.6);
      border: 1px solid rgba(46, 204, 113, 0.2);
      border-radius: 18px;
      padding: 18px;
    }

    .beimadai-col-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #2ecc71;
      text-shadow: 0 0 16px rgba(46, 204, 113, 0.4);
      padding-bottom: 14px;
      user-select: none;
    }

    .beimadai-section-title {
      text-align: center;
      font-size: 14px;
      color: #8fbf9f;
      letter-spacing: 3px;
      padding: 14px 0 10px;
      user-select: none;
    }

    .beimadai-divider {
      height: 2px;
      margin: 4px 0;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(46, 204, 113, 0.15) 15%,
        rgba(46, 204, 113, 0.7) 50%,
        rgba(46, 204, 113, 0.15) 85%,
        transparent 100%);
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.35);
      border-radius: 1px;
      position: relative;
    }

    .beimadai-divider::after {
      content: "◆";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #2ecc71;
      font-size: 10px;
      background: rgba(16, 24, 18, 1);
      padding: 0 8px;
      text-shadow: 0 0 10px rgba(46, 204, 113, 0.8);
    }

    .beimadai-media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      padding: 4px 0 8px;
    }

    .beimadai-media-grid .card {
      aspect-ratio: 1 / 1;
    }

    .beimadai-media-grid .card.video-card {
      aspect-ratio: 16 / 9;
    }

    .footer {
      text-align: center;
      color: rgba(46, 204, 113, 0.35);
      font-size: 12px; letter-spacing: 2px;
      margin-top: 50px; padding-bottom: 10px; user-select: none;
    }

    .modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      display: none; align-items: center; justify-content: center;
      z-index: 900; padding: 20px; flex-direction: column;
    }

    .modal.show { display: flex; }

    .modal .close-btn {
      position: absolute; top: 16px; right: 24px;
      font-size: 38px; color: #fff; cursor: pointer; line-height: 1;
      transition: color 0.3s, transform 0.3s; z-index: 901; user-select: none;
    }

    .modal .close-btn:hover { color: #2ecc71; transform: rotate(90deg); }

    .modal img.modal-img {
      max-width: 94%; max-height: 82vh; border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(46, 204, 113, 0.06);
      object-fit: contain;
    }

    .modal video.modal-video {
      max-width: 94%; max-height: 82vh; border-radius: 10px;
      background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .media-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 44px; color: rgba(255, 255, 255, 0.55);
      cursor: pointer; user-select: none; padding: 20px 14px;
      z-index: 902; transition: color 0.3s, transform 0.3s; line-height: 1;
    }

    .media-nav:hover { color: #2ecc71; transform: translateY(-50%) scale(1.15); }
    .media-nav.prev { left: 6px; }
    .media-nav.next { right: 6px; }

    .media-hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px; letter-spacing: 2px;
      user-select: none; white-space: nowrap;
    }

    .music-modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      display: none; align-items: center; justify-content: center;
      z-index: 950; padding: 20px;
    }

    .music-modal.show { display: flex; }

    .music-modal .close-btn {
      position: absolute; top: 16px; right: 24px;
      font-size: 38px; color: #fff; cursor: pointer; line-height: 1;
      transition: color 0.3s, transform 0.3s; z-index: 951; user-select: none;
    }

    .music-modal .close-btn:hover { color: #2ecc71; transform: rotate(90deg); }

    .music-modal-content {
      display: flex; gap: 20px; width: 100%;
      max-width: 720px; max-height: 88vh;
    }

    .music-player-box {
      flex: 1; min-width: 0;
      background: rgba(16, 24, 18, 0.95);
      border: 1px solid rgba(46, 204, 113, 0.25);
      border-radius: 20px;
      padding: 32px 24px 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 60px rgba(46, 204, 113, 0.06);
      text-align: center;
      display: flex; flex-direction: column; justify-content: center;
    }

    .music-player-box .music-title {
      font-size: 19px; color: #2ecc71; letter-spacing: 3px;
      font-weight: 700; margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(46, 204, 113, 0.3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .music-player-box .music-subtitle {
      font-size: 12px; color: #6a8a70; letter-spacing: 2px; margin-bottom: 20px;
    }

    .music-disc {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1a2a1e, #0e1a12);
      border: 2px solid rgba(46, 204, 113, 0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #2ecc71;
      animation: spin 4s linear infinite;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.15);
    }

    .music-disc.paused { animation-play-state: paused; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .progress-wrap {
      display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
    }

    .progress-wrap .time {
      font-size: 11px; color: #6a8a70; min-width: 36px;
      letter-spacing: 1px; user-select: none;
    }

    .progress-bar {
      flex: 1; height: 6px;
      background: rgba(46, 204, 113, 0.12);
      border-radius: 3px; position: relative;
      cursor: pointer; overflow: hidden; transition: height 0.2s;
    }

    .progress-bar:hover { height: 8px; }

    .progress-bar .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2ecc71, #1abc5c);
      border-radius: 3px; width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    .music-controls {
      display: flex; align-items: center; justify-content: center; gap: 20px;
    }

    .music-controls button {
      background: transparent;
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71; width: 48px; height: 48px;
      border-radius: 50%; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; user-select: none;
    }

    .music-controls button:hover {
      background: rgba(46, 204, 113, 0.15); border-color: #2ecc71;
    }

    .music-controls button:active { transform: scale(0.92); }

    .music-controls button.play-pause {
      width: 60px; height: 60px; font-size: 22px;
      background: rgba(46, 204, 113, 0.12);
      border-color: rgba(46, 204, 113, 0.5);
    }

    .music-controls button.play-pause:hover { background: rgba(46, 204, 113, 0.25); }

    .music-list-box {
      width: 220px; flex-shrink: 0;
      background: rgba(16, 24, 18, 0.95);
      border: 1px solid rgba(46, 204, 113, 0.2);
      border-radius: 20px;
      padding: 18px 0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .music-list-box .list-title {
      font-size: 13px; color: #6a8a70; letter-spacing: 3px;
      padding: 0 18px 12px;
      border-bottom: 1px solid rgba(46, 204, 113, 0.12);
      user-select: none;
    }

    .music-list-box .list-scroll {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }

    .music-list-box .list-item {
      padding: 12px 18px;
      font-size: 14px; color: #a0c8a8; letter-spacing: 1px;
      cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; gap: 8px;
      user-select: none;
    }

    .music-list-box .list-item:hover {
      background: rgba(46, 204, 113, 0.1);
      color: #d0f0d8; padding-left: 22px;
    }

    .music-list-box .list-item.active {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71; font-weight: 700;
      border-left: 3px solid #2ecc71;
      padding-left: 15px;
    }

    .music-list-box .list-item .item-icon {
      font-size: 12px; opacity: 0.6; flex-shrink: 0;
    }

    .music-list-box .list-item.active .item-icon { opacity: 1; }

    .music-list-box .list-scroll::-webkit-scrollbar { width: 4px; }
    .music-list-box .list-scroll::-webkit-scrollbar-track { background: transparent; }
    .music-list-box .list-scroll::-webkit-scrollbar-thumb {
      background: rgba(46, 204, 113, 0.25); border-radius: 2px;
    }
    .music-list-box .list-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(46, 204, 113, 0.5);
    }

    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0f0c;
      background-image: radial-gradient(circle at 30% 30%, rgba(30, 80, 50, 0.25) 0%, transparent 55%),
                        radial-gradient(circle at 75% 75%, rgba(20, 120, 60, 0.18) 0%, transparent 55%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.4s ease;
    }

    .lock-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    .lock-close-btn {
      position: absolute;
      top: 16px;
      right: 24px;
      font-size: 38px;
      color: #fff;
      cursor: pointer;
      line-height: 1;
      transition: color 0.3s, transform 0.3s;
      user-select: none;
      z-index: 10000;
    }

    .lock-close-btn:hover { color: #2ecc71; transform: rotate(90deg); }

    .lock-title {
      font-size: 20px;
      letter-spacing: 6px;
      color: #2ecc71;
      text-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
      margin-bottom: 10px;
      font-weight: 700;
      text-align: center;
    }

    .lock-subtitle {
      font-size: 12px;
      color: #6a8a70;
      letter-spacing: 3px;
      margin-bottom: 28px;
      text-align: center;
    }

    .lock-display {
      width: 260px;
      max-width: 80vw;
      height: 60px;
      border-radius: 14px;
      background: rgba(16, 24, 18, 0.9);
      border: 1px solid rgba(46, 204, 113, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5), 0 0 20px rgba(46, 204, 113, 0.08);
      transition: border-color 0.3s, box-shadow 0.3s;
      overflow: hidden;
    }

    .lock-display .digit {
      font-size: 28px;
      font-weight: 700;
      color: #2ecc71;
      text-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
      min-width: 22px;
      text-align: center;
      animation: digitIn 0.15s ease;
    }

    @keyframes digitIn {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .lock-display.error {
      border-color: #e74c3c;

      if (currentMusicIndex !== -1 && !musicPlayer.paused) return;
      if (currentTab === "video") return;
      bgmAudio.volume = 1.0;
      bgmAudio.play().catch(() => {});
      updateBgmBarState();
    }

    function toggleBgm() {
      if (bgmBar.classList.contains("disabled")) return;
      if (bgmEnabled) {
        bgmEnabled = false;
        bgmAudio.pause();
      } else {
        bgmEnabled = true;
        if (currentMusicIndex === -1 || musicPlayer.paused) {
          if (currentTab !== "video") {
            bgmAudio.volume = 1.0;
            bgmAudio.play().catch(() => {});
          }
        }
      }
      updateBgmBarState();
    }

    function showMusicToast(name, playing) {
      toastText.textContent = playing ? name : name + "（已暂停）";
      if (playing) musicToast.classList.remove("paused");
      else musicToast.classList.add("paused");
      musicToast.classList.add("show");
    }

    function hideMusicToast() {
      musicToast.classList.remove("show");
      musicToast.classList.remove("paused");
    }

    function stopMusic(silent) {
      musicPlayer.pause();
      musicPlayer.src = "";
      if (currentMusicIndex !== -1) {
        const cards = document.querySelectorAll(".music-card");
        if (cards[currentMusicIndex]) cards[currentMusicIndex].classList.remove("playing");
        currentMusicIndex = -1;
      }
      musicPausedByUser = false;
      updateMusicListHighlight();
      hideMusicToast();
      closeMusicModal();
      updatePlayPauseButton();
      if (!silent && bgmEnabled && currentTab !== "video") {
        bgmAudio.volume = 1.0;
        bgmAudio.play().catch(() => {});
      }
      updateBgmBarState();
    }

    function playMusic(index) {
      const music = MUSIC_LIST[index];

      if (currentMusicIndex === index && !musicPlayer.paused) {
        openMusicModal();
        return;
      }

      bgmAudio.pause();
      musicPausedByUser = false;

      if (currentMusicIndex !== -1) {
        const prevCards = document.querySelectorAll(".music-card");
        if (prevCards[currentMusicIndex]) prevCards[currentMusicIndex].classList.remove("playing");
      }

      musicPlayer.src = music.file;
      musicPlayer.volume = 0.8;
      musicPlayer.play().catch(() => {
        alert("无法播放该音乐，请检查文件是否存在：" + music.file);
      });
      currentMusicIndex = index;

      const cards = document.querySelectorAll(".music-card");
      if (cards[index]) cards[index].classList.add("playing");

      showMusicToast(music.name, true);
      openMusicModal();
      updateBgmBarState();
    }

    musicPlayer.addEventListener("ended", function () {
      const endedIndex = currentMusicIndex;
      currentMusicIndex = -1;
      musicPausedByUser = false;
      const cards = document.querySelectorAll(".music-card");
      if (cards[endedIndex]) cards[endedIndex].classList.remove("playing");
      if (bgmEnabled && currentTab !== "video") {
        bgmAudio.volume = 1.0;
        bgmAudio.play().catch(() => {});
      }
      hideMusicToast();
      updateMusicListHighlight();
      closeMusicModal();
      updatePlayPauseButton();
      updateBgmBarState();
    });

    musicPlayer.addEventListener("pause", function () {
      updatePlayPauseButton();
      if (currentMusicIndex !== -1 && !musicPlayer.ended && musicPlayer.src) {
        showMusicToast(MUSIC_LIST[currentMusicIndex].name, false);
      }
      updateBgmBarState();
    });

    musicPlayer.addEventListener("play", function () {
      updatePlayPauseButton();
      if (currentMusicIndex !== -1) {
        showMusicToast(MUSIC_LIST[currentMusicIndex].name, true);
      }
      updateBgmBarState();
    });

    function updateProgress() {
      const current = musicPlayer.currentTime;
      const duration = musicPlayer.duration;
      if (isNaN(duration) || duration === 0) return;
      const percent = (current / duration) * 100;
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("currentTime").textContent = formatTime(current);
      document.getElementById("durationTime").textContent = formatTime(duration);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }

    musicPlayer.addEventListener("timeupdate", updateProgress);
    musicPlayer.addEventListener("loadedmetadata", updateProgress);

    document.getElementById("progressBar").addEventListener("click", function (e) {
      const rect = this.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      if (musicPlayer.duration) musicPlayer.currentTime = percent * musicPlayer.duration;
    });

    function toggleMusicPlay() {
      if (musicPlayer.paused) {
        musicPlayer.play().catch(() => {});
      } else {
        musicPlayer.pause();
      }
    }

    function musicPrev() {
      if (currentMusicIndex === -1) return;
      const newIndex = (currentMusicIndex - 1 + MUSIC_LIST.length) % MUSIC_LIST.length;
      playMusic(newIndex);
    }

    function musicNext() {
      if (currentMusicIndex === -1) return;
      const newIndex = (currentMusicIndex + 1) % MUSIC_LIST.length;
      playMusic(newIndex);
    }

    const musicModal = document.getElementById("musicModal");

    function openMusicModal() {
      if (currentMusicIndex === -1) return;
      const music = MUSIC_LIST[currentMusicIndex];
      document.getElementById("musicTitle").textContent = music.name;
      updatePlayPauseButton();
      musicModal.classList.add("show");
      updateProgress();
      updateMusicListHighlight();
      scrollToActiveListItem();
    }

    function closeMusicModal() {
      musicModal.classList.remove("show");
    }

    musicModal.addEventListener("click", function (e) {
      if (e.target === musicModal) closeMusicModal();
    });

    const musicListScroll = document.getElementById("musicListScroll");

    function renderMusicList() {
      musicListScroll.innerHTML = "";
      MUSIC_LIST.forEach((m, i) => {
        const item = document.createElement("div");
        item.className = "list-item";
        item.dataset.index = i;
        item.innerHTML = `<span class="item-icon">♪</span><span>${m.name}</span>`;
        item.onclick = () => playMusic(i);
        musicListScroll.appendChild(item);
      });
    }

    function updateMusicListHighlight() {
      const items = musicListScroll.querySelectorAll(".list-item");
      items.forEach((item, i) => {
        if (i === currentMusicIndex) item.classList.add("active");
        else item.classList.remove("active");
      });
    }

    function scrollToActiveListItem() {
      const activeItem = musicListScroll.querySelector(".list-item.active");
      if (activeItem) activeItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    const imgGrid = document.getElementById("imgGrid");
    IMAGES.forEach((src, i) => {
      const card = document.createElement("div");
      card.className = "card";
      const img = document.createElement("img");
      img.src = src;
      img.alt = "图片 " + (i + 1);
      img.loading = "lazy";
      img.onerror = function () {
        this.style.display = "none";
        card.style.background = "linear-gradient(145deg, #1a2a1e, #0e1a12)";
        const tip = document.createElement("div");
        tip.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a6a50;font-size:13px;text-align:center;";
        tip.textContent = "图片加载失败";
        card.appendChild(tip);
      };
      card.appendChild(img);
      card.onclick = () => openMedia("img", i);
      imgGrid.appendChild(card);
    });

    const videoGrid = document.getElementById("videoGrid");
    VIDEOS.forEach((v, i) => {
      const card = document.createElement("div");
      card.className = "card video-card";

      const vid = document.createElement("video");
      vid.src = v.src;
      vid.muted = true;
      vid.preload = "metadata";
      vid.setAttribute("playsinline", "");
      vid.onerror = function () {
        this.style.display = "none";
        card.style.background = "linear-gradient(145deg, #1a2a1e, #0e1a12)";
        const tip = document.createElement("div");
        tip.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a6a50;font-size:13px;text-align:center;";
        tip.textContent = "视频加载失败";
        card.appendChild(tip);
      };

      const playIcon = document.createElement("div");
      playIcon.className = "play-icon";
      playIcon.textContent = "▶";

      card.appendChild(vid);
      card.appendChild(playIcon);
      card.onclick = () => openMedia("video", i);
      videoGrid.appendChild(card);
    });

    const musicGrid = document.getElementById("musicGrid");
    MUSIC_LIST.forEach((m, i) => {
      const card = document.createElement("div");
      card.className = "card music-card";
      card.innerHTML = `<span class="music-icon">♪</span><span class="music-name">${m.name}</span>`;
      card.onclick = () => playMusic(i);
      musicGrid.appendChild(card);
    });

    function buildMediaGrid(container, items, type) {
      container.innerHTML = "";
      items.forEach((item, i) => {
        const card = document.createElement("div");
        if (type === "img") {
          card.className = "card";
          const img = document.createElement("img");
          img.src = item;
          img.alt = "图片";
          img.loading = "lazy";
          img.onerror = function () {
            this.style.display = "none";
            card.style.background = "linear-gradient(145deg, #1a2a1e, #0e1a12)";
            const tip = document.createElement("div");
            tip.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a6a50;font-size:12px;text-align:center;";
            tip.textContent = "加载失败";
            card.appendChild(tip);
          };
          card.appendChild(img);
          card.onclick = () => openMediaList("img", items, i);
        } else {
          card.className = "card video-card";
          const vid = document.createElement("video");
          vid.src = item;
          vid.muted = true;
          vid.preload = "metadata";
          vid.setAttribute("playsinline", "");
          vid.onerror = function () {
            this.style.display = "none";
            card.style.background = "linear-gradient(145deg, #1a2a1e, #0e1a12)";
            const tip = document.createElement("div");
            tip.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a6a50;font-size:12px;text-align:center;";
            tip.textContent = "加载失败";
            card.appendChild(tip);
          };
          const playIcon = document.createElement("div");
          playIcon.className = "play-icon";
          playIcon.textContent = "▶";
          card.appendChild(vid);
          card.appendChild(playIcon);
          card.onclick = () => openMediaList("video", items, i);
        }
        container.appendChild(card);
      });
    }

    buildMediaGrid(document.getElementById("htcImgGrid"), HTC_IMAGES, "img");
    buildMediaGrid(document.getElementById("htcVideoGrid"), HTC_VIDEOS, "video");
    buildMediaGrid(document.getElementById("zcxImgGrid"), ZCX_IMAGES, "img");
    buildMediaGrid(document.getElementById("zcxVideoGrid"), ZCX_VIDEOS, "video");

    function switchTab(type, btn) {
      document.querySelectorAll(".tab-bar button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      currentTab = type;
      imgGrid.style.display = type === "img" ? "grid" : "none";
      videoGrid.style.display = type === "video" ? "grid" : "none";
      musicGrid.style.display = type === "music" ? "grid" : "none";
      naziGrid.classList.toggle("show", type === "nazi");
      beimadaiGrid.classList.toggle("show", type === "beimadai");

      if (type === "video") {
        bgmAudio.pause();
      } else {
        if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused)) {
          bgmAudio.volume = 1.0;
          bgmAudio.play().catch(() => {});
        }
      }
      updateBgmBarState();
    }

    function naziPlay() {
      const now = Date.now();
      if (now - lastNaziTime < 1000) return;
      lastNaziTime = now;
      naziAudio.currentTime = 0;
      naziAudio.volume = 1.0;
      naziAudio.play().catch(() => {});
      naziBtn.classList.add("pressed");
      setTimeout(() => naziBtn.classList.remove("pressed"), 180);
    }

    const mediaModal = document.getElementById("mediaModal");
    const modalImg = document.getElementById("modalImg");
    const modalVideo = document.getElementById("modalVideo");
    let currentMediaType = "img";
    let currentMediaIndex = 0;
    let currentMediaArray = IMAGES;

    function openMedia(type, index) {
      currentMediaArray = (type === "img") ? IMAGES : VIDEOS.map(v => v.src);
      currentMediaType = type;
      currentMediaIndex = index;

      if (type === "video") {
        bgmAudio.pause();
      } else {
        if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused)) {
          bgmAudio.volume = 1.0;
          bgmAudio.play().catch(() => {});
        }
      }

      showMedia();
      mediaModal.classList.add("show");
      updateBgmBarState();
    }

    function openMediaList(type, arr, index) {
      currentMediaArray = arr;
      currentMediaType = type;
      currentMediaIndex = index;

      if (type === "video") {
        bgmAudio.pause();
      } else {
        if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused)) {
          bgmAudio.volume = 1.0;
          bgmAudio.play().catch(() => {});
        }
      }

      showMedia();
      mediaModal.classList.add("show");
      updateBgmBarState();
    }

    function showMedia() {
      if (currentMediaType === "img") {
        modalImg.src = currentMediaArray[currentMediaIndex];
        modalImg.style.display = "block";
        modalVideo.style.display = "none";
        modalVideo.pause();
        modalVideo.src = "";
        document.getElementById("mediaHint").textContent = `图片 ${currentMediaIndex + 1} / ${currentMediaArray.length} · 点击左右箭头切换`;
      } else {
        modalVideo.src = currentMediaArray[currentMediaIndex];
        modalVideo.style.display = "block";
        modalImg.style.display = "none";
        modalImg.src = "";
        modalVideo.play().catch(() => {});
        document.getElementById("mediaHint").textContent = `视频 ${currentMediaIndex + 1} / ${currentMediaArray.length} · 点击左右箭头切换`;
      }

      const showNav = currentMediaArray.length > 1;
      document.getElementById("mediaPrev").style.display = showNav ? "block" : "none";
      document.getElementById("mediaNext").style.display = showNav ? "block" : "none";
    }

    function prevMedia() {
      currentMediaIndex = (currentMediaIndex - 1 + currentMediaArray.length) % currentMediaArray.length;
      showMedia();
    }

    function nextMedia() {
      currentMediaIndex = (currentMediaIndex + 1) % currentMediaArray.length;
      showMedia();
    }

    function closeMediaModal() {
      mediaModal.classList.remove("show");
      modalVideo.pause();
      modalVideo.src = "";
      modalImg.src = "";

      if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused) && currentTab !== "video") {
        bgmAudio.volume = 1.0;
        bgmAudio.play().catch(() => {});
      }
      updateBgmBarState();
    }

    mediaModal.onclick = function (e) {
      if (e.target === mediaModal) closeMediaModal();
    };

    document.addEventListener("keydown", function (e) {
      if (mediaModal.classList.contains("show")) {
        if (e.key === "Escape") closeMediaModal();
        if (e.key === "ArrowLeft") prevMedia();
        if (e.key === "ArrowRight") nextMedia();
      }
      if (musicModal.classList.contains("show")) {
        if (e.key === "Escape") closeMusicModal();
        if (e.key === " ") {
          e.preventDefault();
          toggleMusicPlay();
        }
      }
    });

    siteTitle.addEventListener("click", function () {
      if (beimadaiUnlocked || eggShowing) return;
      const beimadaiLockEl = document.getElementById("beimadaiLock");
      if (beimadaiLockEl && beimadaiLockEl.style.display === "flex") return;
      titleClickCount++;
      if (titleClickTimer) clearTimeout(titleClickTimer);
      titleClickTimer = setTimeout(function () {
        titleClickCount = 0;
      }, 1500);
      if (titleClickCount >= 5) {
        titleClickCount = 0;
        clearTimeout(titleClickTimer);
        document.getElementById("beimadaiLock").style.display = "flex";
      }
    });

    renderMusicList();
    updatePlayPauseButton();
    updateBgmBarState();
  </script>

</body>
</html>
