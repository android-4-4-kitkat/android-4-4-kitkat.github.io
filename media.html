<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>肥美音乐图片视频集合网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0b0f0c;
      background-image: radial-gradient(circle at 20% 30%, rgba(30, 80, 50, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(20, 120, 60, 0.1) 0%, transparent 50%);
      color: #e0e8e0;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      padding: 20px 16px 30px;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== 顶部标题 ===== */
    .site-title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #2ecc71;
      text-shadow: 0 0 20px rgba(46, 204, 113, 0.4), 0 0 40px rgba(46, 204, 113, 0.1);
      padding: 10px 0 20px;
      user-select: none;
    }

    /* ===== 右上角背景音乐控制条 ===== */
    .bgm-bar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 30, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(46, 204, 113, 0.25);
      border-radius: 40px;
      padding: 6px 14px 6px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .bgm-bar .bgm-label { font-size: 12px; color: #8fbf9f; letter-spacing: 1px; }

    .bgm-bar .bgm-btn {
      background: transparent;
      border: none;
      color: #2ecc71;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 20px;
      transition: all 0.25s;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .bgm-bar .bgm-btn:hover { background: rgba(46, 204, 113, 0.15); }
    .bgm-bar .bgm-btn.active { background: #2ecc71; color: #0b0f0c; }

    /* ===== 左上角音乐播放提示 ===== */
    .music-toast {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 500;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(20, 30, 24, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(46, 204, 113, 0.35);
      border-radius: 30px;
      padding: 8px 16px 8px 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(46, 204, 113, 0.1);
      transition: opacity 0.3s, transform 0.3s;
      max-width: 200px;
    }

    .music-toast.show { display: flex; }

    .music-toast .toast-icon {
      font-size: 16px;
      animation: toastPulse 1.2s ease-in-out infinite;
    }

    @keyframes toastPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.9); }
    }

    .music-toast .toast-text {
      font-size: 12px;
      color: #b8e0c0;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    /* ===== 分类标签栏 ===== */
    .tab-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 26px;
      flex-wrap: wrap;
    }

    .tab-bar button {
      border: 1px solid rgba(46, 204, 113, 0.3);
      background: rgba(20, 30, 24, 0.7);
      color: #a0c8a8;
      padding: 8px 28px;
      border-radius: 30px;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.3s;
      font-weight: 500;
      backdrop-filter: blur(6px);
    }

    .tab-bar button:hover { border-color: #2ecc71; color: #d0f0d8; }
    .tab-bar button.active {
      background: #2ecc71; color: #0b0f0c; border-color: #2ecc71;
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.3); font-weight: 700;
    }

    /* ===== 内容网格 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: rgba(20, 28, 22, 0.8);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(46, 204, 113, 0.12);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(46, 204, 113, 0.45);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(46, 204, 113, 0.08);
    }

    .card:active { transform: scale(0.98); }

    .card img, .card video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .play-icon {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px; color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
      pointer-events: none; transition: transform 0.3s; line-height: 1;
    }

    .card:hover .play-icon { transform: translate(-50%, -50%) scale(1.15); }
    .card.video-card { aspect-ratio: 16 / 9; }

    .card.music-card {
      aspect-ratio: auto; min-height: 80px;
      display: flex; align-items: center; justify-content: center;
      padding: 18px 14px; text-align: center;
      background: linear-gradient(145deg, rgba(18, 28, 22, 0.95), rgba(12, 20, 15, 0.95));
    }

    .music-card .music-icon { font-size: 22px; margin-right: 8px; opacity: 0.6; }
    .music-card .music-name {
      font-size: 15px; color: #b8e0c0; letter-spacing: 2px;
      font-weight: 500; transition: color 0.3s;
    }

    .card.music-card:hover .music-name { color: #2ecc71; }
    .card.music-card.playing { border-color: #2ecc71; box-shadow: 0 0 28px rgba(46, 204, 113, 0.25); }
    .card.music-card.playing .music-name { color: #2ecc71; font-weight: 700; }

    /* ===== 底部版权 ===== */
    .footer {
      text-align: center;
      color: rgba(46, 204, 113, 0.35);
      font-size: 12px; letter-spacing: 2px;
      margin-top: 50px; padding-bottom: 10px; user-select: none;
    }

    /* ============================================================
       图片/视频模态框
       ============================================================ */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      display: none; align-items: center; justify-content: center;
      z-index: 900; padding: 20px; flex-direction: column;
    }

    .modal.show { display: flex; }

    .modal .close-btn {
      position: absolute; top: 16px; right: 24px;
      font-size: 38px; color: #fff; cursor: pointer; line-height: 1;
      transition: color 0.3s, transform 0.3s; z-index: 901; user-select: none;
    }

    .modal .close-btn:hover { color: #2ecc71; transform: rotate(90deg); }

    .modal img.modal-img {
      max-width: 94%; max-height: 82vh; border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(46, 204, 113, 0.06);
      object-fit: contain;
    }

    .modal video.modal-video {
      max-width: 94%; max-height: 82vh; border-radius: 10px;
      background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }

    .media-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 44px; color: rgba(255, 255, 255, 0.55);
      cursor: pointer; user-select: none; padding: 20px 14px;
      z-index: 902; transition: color 0.3s, transform 0.3s; line-height: 1;
    }

    .media-nav:hover { color: #2ecc71; transform: translateY(-50%) scale(1.15); }
    .media-nav.prev { left: 6px; }
    .media-nav.next { right: 6px; }

    .media-hint {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 12px; letter-spacing: 2px;
      user-select: none; white-space: nowrap;
    }

    /* ============================================================
       音乐播放弹窗
       ============================================================ */
    .music-modal {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      display: none; align-items: center; justify-content: center;
      z-index: 950; padding: 20px;
    }

    .music-modal.show { display: flex; }

    .music-modal .close-btn {
      position: absolute; top: 16px; right: 24px;
      font-size: 38px; color: #fff; cursor: pointer; line-height: 1;
      transition: color 0.3s, transform 0.3s; z-index: 951; user-select: none;
    }

    .music-modal .close-btn:hover { color: #2ecc71; transform: rotate(90deg); }

    .music-modal-content {
      display: flex; gap: 20px; width: 100%;
      max-width: 720px; max-height: 88vh;
    }

    .music-player-box {
      flex: 1; min-width: 0;
      background: rgba(16, 24, 18, 0.95);
      border: 1px solid rgba(46, 204, 113, 0.25);
      border-radius: 20px;
      padding: 32px 24px 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 60px rgba(46, 204, 113, 0.06);
      text-align: center;
      display: flex; flex-direction: column; justify-content: center;
    }

    .music-player-box .music-title {
      font-size: 19px; color: #2ecc71; letter-spacing: 3px;
      font-weight: 700; margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(46, 204, 113, 0.3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .music-player-box .music-subtitle {
      font-size: 12px; color: #6a8a70; letter-spacing: 2px; margin-bottom: 20px;
    }

    .music-disc {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1a2a1e, #0e1a12);
      border: 2px solid rgba(46, 204, 113, 0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #2ecc71;
      animation: spin 4s linear infinite;
      box-shadow: 0 0 30px rgba(46, 204, 113, 0.15);
    }

    .music-disc.paused { animation-play-state: paused; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .progress-wrap {
      display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
    }

    .progress-wrap .time {
      font-size: 11px; color: #6a8a70; min-width: 36px;
      letter-spacing: 1px; user-select: none;
    }

    .progress-bar {
      flex: 1; height: 6px;
      background: rgba(46, 204, 113, 0.12);
      border-radius: 3px; position: relative;
      cursor: pointer; overflow: hidden; transition: height 0.2s;
    }

    .progress-bar:hover { height: 8px; }

    .progress-bar .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2ecc71, #1abc5c);
      border-radius: 3px; width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
    }

    .music-controls {
      display: flex; align-items: center; justify-content: center; gap: 20px;
    }

    .music-controls button {
      background: transparent;
      border: 1px solid rgba(46, 204, 113, 0.3);
      color: #2ecc71; width: 48px; height: 48px;
      border-radius: 50%; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.25s; user-select: none;
    }

    .music-controls button:hover {
      background: rgba(46, 204, 113, 0.15); border-color: #2ecc71;
    }

    .music-controls button:active { transform: scale(0.92); }

    .music-controls button.play-pause {
      width: 60px; height: 60px; font-size: 22px;
      background: rgba(46, 204, 113, 0.12);
      border-color: rgba(46, 204, 113, 0.5);
    }

    .music-controls button.play-pause:hover { background: rgba(46, 204, 113, 0.25); }

    /* 右侧音乐列表 */
    .music-list-box {
      width: 220px; flex-shrink: 0;
      background: rgba(16, 24, 18, 0.95);
      border: 1px solid rgba(46, 204, 113, 0.2);
      border-radius: 20px;
      padding: 18px 0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
      display: flex; flex-direction: column; overflow: hidden;
    }

    .music-list-box .list-title {
      font-size: 13px; color: #6a8a70; letter-spacing: 3px;
      padding: 0 18px 12px;
      border-bottom: 1px solid rgba(46, 204, 113, 0.12);
      user-select: none;
    }

    .music-list-box .list-scroll {
      flex: 1; overflow-y: auto; padding: 8px 0;
    }

    .music-list-box .list-item {
      padding: 12px 18px;
      font-size: 14px; color: #a0c8a8; letter-spacing: 1px;
      cursor: pointer; transition: all 0.25s;
      display: flex; align-items: center; gap: 8px;
      user-select: none;
    }

    .music-list-box .list-item:hover {
      background: rgba(46, 204, 113, 0.1);
      color: #d0f0d8; padding-left: 22px;
    }

    .music-list-box .list-item.active {
      background: rgba(46, 204, 113, 0.15);
      color: #2ecc71; font-weight: 700;
      border-left: 3px solid #2ecc71;
      padding-left: 15px;
    }

    .music-list-box .list-item .item-icon {
      font-size: 12px; opacity: 0.6; flex-shrink: 0;
    }

    .music-list-box .list-item.active .item-icon { opacity: 1; }

    .music-list-box .list-scroll::-webkit-scrollbar { width: 4px; }
    .music-list-box .list-scroll::-webkit-scrollbar-track { background: transparent; }
    .music-list-box .list-scroll::-webkit-scrollbar-thumb {
      background: rgba(46, 204, 113, 0.25); border-radius: 2px;
    }
    .music-list-box .list-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(46, 204, 113, 0.5);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 700px) {
      .site-title { font-size: 22px; letter-spacing: 4px; padding-top: 40px; }

      .bgm-bar {
        top: 8px; right: 8px; padding: 4px 10px 4px 12px;
      }
      .bgm-bar .bgm-label { display: none; }
      .bgm-bar .bgm-btn { font-size: 12px; padding: 3px 8px; }

      .music-toast {
        top: 8px; left: 8px; padding: 6px 12px 6px 10px;
      }
      .music-toast .toast-text { font-size: 11px; max-width: 100px; }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }

      .tab-bar button { padding: 6px 18px; font-size: 13px; }
      .play-icon { font-size: 32px; }
      .music-card .music-name { font-size: 13px; letter-spacing: 1px; }

      .media-nav { font-size: 32px; padding: 16px 8px; }

      .music-modal-content {
        flex-direction: column; max-height: 90vh; gap: 14px;
      }

      .music-player-box {
        padding: 24px 18px 20px; flex-shrink: 0;
      }

      .music-player-box .music-title { font-size: 16px; }
      .music-disc { width: 56px; height: 56px; font-size: 24px; margin-bottom: 16px; }

      .music-controls button { width: 42px; height: 42px; font-size: 15px; }
      .music-controls button.play-pause { width: 52px; height: 52px; font-size: 18px; }

      .music-list-box { width: 100%; flex: 1; min-height: 0; padding: 12px 0; }
      .music-list-box .list-title { padding: 0 14px 8px; font-size: 12px; }
      .music-list-box .list-item { padding: 10px 14px; font-size: 13px; }
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f0c; }
    ::-webkit-scrollbar-thumb {
      background: rgba(46, 204, 113, 0.3); border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(46, 204, 113, 0.6); }
  </style>
</head>
<body>

  <!-- ===== 左上角音乐播放提示 ===== -->
  <div class="music-toast" id="musicToast">
    <span class="toast-icon">♪</span>
    <span class="toast-text" id="toastText">正在播放</span>
  </div>

  <!-- ===== 右上角背景音乐控制 ===== -->
  <div class="bgm-bar" id="bgmBar">
    <span class="bgm-label">背景音</span>
    <button class="bgm-btn active" id="bgmToggle" onclick="toggleBgm()">关闭</button>
  </div>

  <!-- ===== 顶部标题 ===== -->
  <h1 class="site-title">肥美音乐图片视频集合网站</h1>

  <!-- ===== 分类标签 ===== -->
  <div class="tab-bar">
    <button class="active" onclick="switchTab('img', this)">图片</button>
    <button onclick="switchTab('video', this)">视频</button>
    <button onclick="switchTab('music', this)">音乐</button>
  </div>

  <!-- ===== 图片网格 ===== -->
  <div class="grid" id="imgGrid"></div>

  <!-- ===== 视频网格 ===== -->
  <div class="grid" id="videoGrid" style="display:none"></div>

  <!-- ===== 音乐网格 ===== -->
  <div class="grid" id="musicGrid" style="display:none"></div>

  <!-- ===== 底部版权 ===== -->
  <div class="footer">android-4-4-kitkat制作</div>

  <!-- ============================================================
       图片/视频模态框
       ============================================================ -->
  <div class="modal" id="mediaModal">
    <span class="close-btn" onclick="closeMediaModal()">×</span>
    <span class="media-nav prev" id="mediaPrev" onclick="prevMedia()">❮</span>
    <img class="modal-img" id="modalImg" alt="">
    <video class="modal-video" id="modalVideo" controls playsinline></video>
    <span class="media-nav next" id="mediaNext" onclick="nextMedia()">❯</span>
    <div class="media-hint" id="mediaHint">点击空白处或 × 关闭</div>
  </div>

  <!-- ============================================================
       音乐播放弹窗
       ============================================================ -->
  <div class="music-modal" id="musicModal">
    <span class="close-btn" onclick="closeMusicModal()">×</span>
    <div class="music-modal-content">
      <div class="music-player-box">
        <div class="music-title" id="musicTitle">大山子孙音乐</div>
        <div class="music-subtitle">正在播放</div>
        <div class="music-disc" id="musicDisc">♪</div>

        <div class="progress-wrap">
          <span class="time" id="currentTime">00:00</span>
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="time" id="durationTime">00:00</span>
        </div>

        <div class="music-controls">
          <button onclick="musicPrev()" title="上一首">⏮</button>
          <button class="play-pause" id="musicPlayPause" onclick="toggleMusicPlay()">⏸</button>
          <button onclick="musicNext()" title="下一首">⏭</button>
        </div>
      </div>

      <div class="music-list-box">
        <div class="list-title">音乐列表</div>
        <div class="list-scroll" id="musicListScroll"></div>
      </div>
    </div>
  </div>

  <!-- ===== 背景音乐（隐藏） ===== -->
  <audio id="bgmAudio" src="ng.mp3" loop preload="auto"></audio>

  <!-- ===== 独立音乐播放器（隐藏） ===== -->
  <audio id="musicPlayer" preload="auto"></audio>

  <script>
    /* ============================================================
       素材配置（已更新：图片 7 张，视频 2 个）
       ============================================================ */
    const IMAGES = ["1.png", "2.png", "3.png", "4.png", "5.png", "6.png", "7.png"];
    const VIDEOS = [
      { name: "a.mp4", src: "a.mp4" },
      { name: "b.mp4", src: "b.mp4" }
    ];
    const MUSIC_LIST = [
      { name: "大山子孙音乐", file: "dszs.mp3" },
      { name: "郭佑斌音乐", file: "gyb.mp3" },
      { name: "廖彩云音乐", file: "lcy.mp3" },
      { name: "尿颠玉音乐", file: "ndy.mp3" },
      { name: "许丽君音乐", file: "xlj.mp3" }
    ];

    /* ============================================================
       全局状态
       ============================================================ */
    const bgmAudio = document.getElementById("bgmAudio");
    const musicPlayer = document.getElementById("musicPlayer");
    const bgmToggle = document.getElementById("bgmToggle");
    const musicToast = document.getElementById("musicToast");
    const toastText = document.getElementById("toastText");
    let bgmEnabled = true;
    let currentMusicIndex = -1;
    let musicPausedByUser = false;

    /* ============================================================
       背景音乐控制
       ============================================================ */
    function tryPlayBgm() {
      if (!bgmEnabled) return;
      if (currentMusicIndex !== -1 && !musicPlayer.paused) return;
      bgmAudio.volume = 0.45;
      bgmAudio.play().catch(() => {});
    }

    function onFirstInteraction() {
      if (bgmEnabled && bgmAudio.paused && (currentMusicIndex === -1 || musicPlayer.paused)) {
        bgmAudio.play().catch(() => {});
      }
      document.removeEventListener("click", onFirstInteraction);
      document.removeEventListener("touchstart", onFirstInteraction);
    }
    document.addEventListener("click", onFirstInteraction);
    document.addEventListener("touchstart", onFirstInteraction);
    window.addEventListener("load", tryPlayBgm);

    function toggleBgm() {
      if (bgmEnabled) {
        bgmEnabled = false;
        bgmAudio.pause();
        bgmToggle.textContent = "播放";
        bgmToggle.classList.remove("active");
      } else {
        bgmEnabled = true;
        if (currentMusicIndex === -1 || musicPlayer.paused) {
          bgmAudio.play().catch(() => {});
        }
        bgmToggle.textContent = "关闭";
        bgmToggle.classList.add("active");
      }
    }

    /* ============================================================
       左上角音乐提示
       ============================================================ */
    function showMusicToast(name, playing) {
      toastText.textContent = playing ? name : name + "（已暂停）";
      musicToast.classList.add("show");
    }

    function hideMusicToast() {
      musicToast.classList.remove("show");
    }

    /* ============================================================
       音乐播放控制
       ============================================================ */
    function stopMusic(silent) {
      musicPlayer.pause();
      musicPlayer.src = "";
      if (currentMusicIndex !== -1) {
        const cards = document.querySelectorAll(".music-card");
        if (cards[currentMusicIndex]) cards[currentMusicIndex].classList.remove("playing");
        currentMusicIndex = -1;
      }
      musicPausedByUser = false;
      updateMusicListHighlight();
      hideMusicToast();
      if (!silent && bgmEnabled) {
        bgmAudio.play().catch(() => {});
      }
    }

    function playMusic(index) {
      const music = MUSIC_LIST[index];

      if (currentMusicIndex === index && !musicPlayer.paused) {
        openMusicModal();
        return;
      }

      bgmAudio.pause();
      musicPausedByUser = false;

      if (currentMusicIndex !== -1) {
        const prevCards = document.querySelectorAll(".music-card");
        if (prevCards[currentMusicIndex]) prevCards[currentMusicIndex].classList.remove("playing");
      }

      musicPlayer.src = music.file;
      musicPlayer.volume = 0.8;
      musicPlayer.play().catch(() => {
        alert("无法播放该音乐，请检查文件是否存在：" + music.file);
      });
      currentMusicIndex = index;

      const cards = document.querySelectorAll(".music-card");
      if (cards[index]) cards[index].classList.add("playing");

      showMusicToast(music.name, true);
      openMusicModal();
    }

    musicPlayer.addEventListener("ended", function () {
      const endedIndex = currentMusicIndex;
      currentMusicIndex = -1;
      musicPausedByUser = false;
      const cards = document.querySelectorAll(".music-card");
      if (cards[endedIndex]) cards[endedIndex].classList.remove("playing");
      if (bgmEnabled) bgmAudio.play().catch(() => {});
      hideMusicToast();
      updateMusicListHighlight();
      closeMusicModal();
    });

    function updateProgress() {
      const current = musicPlayer.currentTime;
      const duration = musicPlayer.duration;
      if (isNaN(duration) || duration === 0) return;
      const percent = (current / duration) * 100;
      document.getElementById("progressFill").style.width = percent + "%";
      document.getElementById("currentTime").textContent = formatTime(current);
      document.getElementById("durationTime").textContent = formatTime(duration);
    }

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }

    musicPlayer.addEventListener("timeupdate", updateProgress);
    musicPlayer.addEventListener("loadedmetadata", updateProgress);

    document.getElementById("progressBar").addEventListener("click", function (e) {
      const rect = this.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      if (musicPlayer.duration) musicPlayer.currentTime = percent * musicPlayer.duration;
    });

    /* ============================================================
       播放 / 暂停
       ============================================================ */
    function toggleMusicPlay() {
      if (musicPlayer.paused) {
        musicPlayer.play().catch(() => {});
        document.getElementById("musicPlayPause").textContent = "⏸";
        document.getElementById("musicDisc").classList.remove("paused");
        musicPausedByUser = false;
        bgmAudio.pause();
        if (currentMusicIndex !== -1) {
          showMusicToast(MUSIC_LIST[currentMusicIndex].name, true);
        }
      } else {
        musicPlayer.pause();
        document.getElementById("musicPlayPause").textContent = "▶";
        document.getElementById("musicDisc").classList.add("paused");
        musicPausedByUser = true;

        if (bgmEnabled) {
          bgmAudio.play().catch(() => {});
        }
        if (currentMusicIndex !== -1) {
          showMusicToast(MUSIC_LIST[currentMusicIndex].name, false);
        }
      }
    }

    function musicPrev() {
      if (currentMusicIndex === -1) return;
      const newIndex = (currentMusicIndex - 1 + MUSIC_LIST.length) % MUSIC_LIST.length;
      playMusic(newIndex);
    }

    function musicNext() {
      if (currentMusicIndex === -1) return;
      const newIndex = (currentMusicIndex + 1) % MUSIC_LIST.length;
      playMusic(newIndex);
    }

    /* ============================================================
       音乐弹窗
       ============================================================ */
    const musicModal = document.getElementById("musicModal");

    function openMusicModal() {
      if (currentMusicIndex === -1) return;
      const music = MUSIC_LIST[currentMusicIndex];
      document.getElementById("musicTitle").textContent = music.name;
      document.getElementById("musicPlayPause").textContent = musicPlayer.paused ? "▶" : "⏸";
      if (musicPlayer.paused) {
        document.getElementById("musicDisc").classList.add("paused");
      } else {
        document.getElementById("musicDisc").classList.remove("paused");
      }
      musicModal.classList.add("show");
      updateProgress();
      updateMusicListHighlight();
      scrollToActiveListItem();
    }

    function closeMusicModal() {
      musicModal.classList.remove("show");
    }

    musicModal.addEventListener("click", function (e) {
      if (e.target === musicModal) closeMusicModal();
    });

    /* ============================================================
       音乐列表
       ============================================================ */
    const musicListScroll = document.getElementById("musicListScroll");

    function renderMusicList() {
      musicListScroll.innerHTML = "";
      MUSIC_LIST.forEach((m, i) => {
        const item = document.createElement("div");
        item.className = "list-item";
        item.dataset.index = i;
        item.innerHTML = `<span class="item-icon">♪</span><span>${m.name}</span>`;
        item.onclick = () => playMusic(i);
        musicListScroll.appendChild(item);
      });
    }

    function updateMusicListHighlight() {
      const items = musicListScroll.querySelectorAll(".list-item");
      items.forEach((item, i) => {
        if (i === currentMusicIndex) item.classList.add("active");
        else item.classList.remove("active");
      });
    }

    function scrollToActiveListItem() {
      const activeItem = musicListScroll.querySelector(".list-item.active");
      if (activeItem) activeItem.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    /* ============================================================
       渲染图片网格
       ============================================================ */
    const imgGrid = document.getElementById("imgGrid");
    IMAGES.forEach((src, i) => {
      const card = document.createElement("div");
      card.className = "card";
      const img = document.createElement("img");
      img.src = src;
      img.alt = "图片 " + (i + 1);
      img.loading = "lazy";
      img.onerror = function () {
        this.style.display = "none";
        card.style.background = "linear-gradient(145deg, #1a2a1e, #0e1a12)";
        const tip = document.createElement("div");
        tip.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a6a50;font-size:13px;text-align:center;";
        tip.textContent = "图片加载失败";
        card.appendChild(tip);
      };
      card.appendChild(img);
      card.onclick = () => openMedia("img", i);
      imgGrid.appendChild(card);
    });

    /* ============================================================
       渲染视频网格
       ============================================================ */
    const videoGrid = document.getElementById("videoGrid");
    VIDEOS.forEach((v, i) => {
      const card = document.createElement("div");
      card.className = "card video-card";

      const vid = document.createElement("video");
      vid.src = v.src;
      vid.muted = true;
      vid.preload = "metadata";
      vid.setAttribute("playsinline", "");
      vid.onerror = function () {
        this.style.display = "none";
        card.style.background = "linear-gradient(145deg, #1a2a1e, #0e1a12)";
        const tip = document.createElement("div");
        tip.style.cssText = "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#4a6a50;font-size:13px;text-align:center;";
        tip.textContent = "视频加载失败";
        card.appendChild(tip);
      };

      const playIcon = document.createElement("div");
      playIcon.className = "play-icon";
      playIcon.textContent = "▶";

      card.appendChild(vid);
      card.appendChild(playIcon);
      card.onclick = () => openMedia("video", i);
      videoGrid.appendChild(card);
    });

    /* ============================================================
       渲染音乐网格
       ============================================================ */
    const musicGrid = document.getElementById("musicGrid");
    MUSIC_LIST.forEach((m, i) => {
      const card = document.createElement("div");
      card.className = "card music-card";
      card.innerHTML = `<span class="music-icon">♪</span><span class="music-name">${m.name}</span>`;
      card.onclick = () => playMusic(i);
      musicGrid.appendChild(card);
    });

    /* ============================================================
       分类切换
       ============================================================ */
    function switchTab(type, btn) {
      document.querySelectorAll(".tab-bar button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      imgGrid.style.display = type === "img" ? "grid" : "none";
      videoGrid.style.display = type === "video" ? "grid" : "none";
      musicGrid.style.display = type === "music" ? "grid" : "none";

      if (type === "video") {
        bgmAudio.pause();
      } else {
        if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused)) {
          bgmAudio.play().catch(() => {});
        }
      }
    }

    /* ============================================================
       媒体模态框（图片/视频）
       ============================================================ */
    const mediaModal = document.getElementById("mediaModal");
    const modalImg = document.getElementById("modalImg");
    const modalVideo = document.getElementById("modalVideo");
    let currentMediaType = "img";
    let currentMediaIndex = 0;

    function openMedia(type, index) {
      currentMediaType = type;
      currentMediaIndex = index;

      if (type === "video") {
        bgmAudio.pause();
      } else {
        if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused)) {
          bgmAudio.play().catch(() => {});
        }
      }

      showMedia();
      mediaModal.classList.add("show");
    }

    function showMedia() {
      if (currentMediaType === "img") {
        modalImg.src = IMAGES[currentMediaIndex];
        modalImg.style.display = "block";
        modalVideo.style.display = "none";
        modalVideo.pause();
        modalVideo.src = "";
        document.getElementById("mediaHint").textContent = `图片 ${currentMediaIndex + 1} / ${IMAGES.length} · 点击左右箭头切换`;
      } else {
        modalVideo.src = VIDEOS[currentMediaIndex].src;
        modalVideo.style.display = "block";
        modalImg.style.display = "none";
        modalImg.src = "";
        modalVideo.play().catch(() => {});
        document.getElementById("mediaHint").textContent = `视频 ${currentMediaIndex + 1} / ${VIDEOS.length} · 点击左右箭头切换`;
      }

      const showNav = (currentMediaType === "img" && IMAGES.length > 1) ||
                      (currentMediaType === "video" && VIDEOS.length > 1);
      document.getElementById("mediaPrev").style.display = showNav ? "block" : "none";
      document.getElementById("mediaNext").style.display = showNav ? "block" : "none";
    }

    function prevMedia() {
      if (currentMediaType === "img") {
        currentMediaIndex = (currentMediaIndex - 1 + IMAGES.length) % IMAGES.length;
      } else {
        currentMediaIndex = (currentMediaIndex - 1 + VIDEOS.length) % VIDEOS.length;
      }
      showMedia();
    }

    function nextMedia() {
      if (currentMediaType === "img") {
        currentMediaIndex = (currentMediaIndex + 1) % IMAGES.length;
      } else {
        currentMediaIndex = (currentMediaIndex + 1) % VIDEOS.length;
      }
      showMedia();
    }

    function closeMediaModal() {
      mediaModal.classList.remove("show");
      modalVideo.pause();
      modalVideo.src = "";
      modalImg.src = "";

      if (bgmEnabled && (currentMusicIndex === -1 || musicPlayer.paused)) {
        bgmAudio.play().catch(() => {});
      }
    }

    mediaModal.onclick = function (e) {
      if (e.target === mediaModal) closeMediaModal();
    };

    /* ============================================================
       键盘控制
       ============================================================ */
    document.addEventListener("keydown", function (e) {
      if (mediaModal.classList.contains("show")) {
        if (e.key === "Escape") closeMediaModal();
        if (e.key === "ArrowLeft") prevMedia();
        if (e.key === "ArrowRight") nextMedia();
      }
      if (musicModal.classList.contains("show")) {
        if (e.key === "Escape") closeMusicModal();
        if (e.key === " ") {
          e.preventDefault();
          toggleMusicPlay();
        }
      }
    });

    /* ============================================================
       初始化
       ============================================================ */
    renderMusicList();
    setTimeout(tryPlayBgm, 300);
  </script>

</body>
</html>
